# Server
server.port=8080
spring.application.name=notifyservice

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/notifydb
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator
management.endpoints.web.exposure.include=health

# Suppress the open-in-view warning
spring.jpa.open-in-view=false

# JWT Configuration
# Note: For HS256, the secret MUST be at least 256 bits (32 characters or a 64+ hex string)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Expiration: 24 hours in milliseconds (86,400,000 ms)
jwt.expiration=86400000